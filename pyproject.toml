[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "guardrail"
version = "0.1.0"
description = "Production Verification Engine for AI-Generated Software"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [
    { name = "Guardrail Contributors" },
]
keywords = [
    "verification",
    "load-testing",
    "static-analysis",
    "production-readiness",
    "chaos-engineering",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Testing",
    "Topic :: Software Development :: Quality Assurance",
]

dependencies = [
    "click>=8.1",
    "rich>=13.8",
    "pydantic>=2.8",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    "pluggy>=1.5",
    "tree-sitter>=0.24",
    "tree-sitter-python>=0.23",
    "tree-sitter-javascript>=0.23",
    "tree-sitter-typescript>=0.23",
    "docker>=7.1",
    "httpx>=0.27",
    "psutil>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
]
runtime = [
    "testcontainers>=4.15",
    "locust>=2.31",
    "scipy>=1.14",
    "numpy>=2.0",
]
llm = [
    "openai>=1.30",
    "anthropic>=0.25",
    "google-generativeai>=0.5",
]

[project.scripts]
guardrail = "guardrail.cli.main:cli"

[project.entry-points."guardrail.adapters"]
python = "guardrail.adapters.language.python:PythonLanguageAdapter"
javascript = "guardrail.adapters.language.javascript:JavaScriptLanguageAdapter"
postgresql = "guardrail.adapters.database.postgresql:PostgreSQLAdapter"
http = "guardrail.adapters.protocol.http:HTTPProtocolAdapter"
docker = "guardrail.adapters.runtime.docker:DockerRuntimeAdapter"

[tool.hatch.build.targets.wheel]
packages = ["src/guardrail"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]
exclude = [".git", ".venv", "examples"]


[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific rules
]
ignore = [
    "E501",    # line length handled by formatter
    "TC001",   # type-checking imports needed at runtime for Pydantic
    "TC002",
    "TC003",
    "UP042",   # keep str, Enum for broader serialization compatibility
    "N801",    # allow rule ID prefixes in rule class names (e.g. DB001_...)
    "N806",    # allow uppercase constants inside functions
    "E402",    # allow CLI subcommand registration imports
    "E741",    # allow short comprehension vars
    "B007",    # allow unused loop vars
    "B904",    # allow re-raising in CLI commands
    "SIM102",
    "SIM105",
    "SIM118",
    "RUF012",
]

[tool.ruff.lint.isort]
known-first-party = ["guardrail"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --tb=short"

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
